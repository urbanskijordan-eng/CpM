<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1a">
<title>Défauts Résolus</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0f1a; --bg2:#111827; --bg3:#1a2235; --border:#1e2d45;
    --accent:#10b981; --text:#e2e8f0; --text2:#94a3b8; --text3:#475569;
    --red:#ef4444; --amber:#f59e0b;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    --radius:12px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

  /* LOGIN */
  .login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;z-index:1000}
  .login-screen.hidden{display:none}
  .login-logo{font-size:48px;margin-bottom:20px}
  .login-title{font-size:22px;font-weight:600;margin-bottom:4px}
  .login-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:2px;margin-bottom:40px}
  .login-input{width:100%;max-width:280px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);font-family:var(--mono);font-size:20px;letter-spacing:4px;text-align:center;outline:none;transition:border-color .2s;margin-bottom:16px}
  .login-input:focus{border-color:var(--accent)}
  .login-input.error{border-color:var(--red);animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .login-btn{width:100%;max-width:280px;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#000;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;box-shadow:0 0 20px rgba(16,185,129,.3)}
  .login-error{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:12px;min-height:16px}

  /* SYNC */
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:5px;transition:background .3s}
  .sync-dot.online{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
  .sync-dot.error{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sync-label{font-family:var(--mono);font-size:10px;color:var(--text3)}

  /* HEADER */
  .header{position:sticky;top:0;z-index:100;background:rgba(10,15,26,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 14px) 16px 14px}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand-label{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
  .brand-title{font-size:20px;font-weight:600;letter-spacing:-.3px}
  .brand-meta{display:flex;align-items:center;margin-top:3px}
  .brand-count{font-family:var(--mono);font-size:10px;color:var(--text3)}
  .header-btns{display:flex;gap:10px;align-items:center}
  .export-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
  .export-btn:active{border-color:var(--accent);color:var(--accent)}
  .add-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;color:#000;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px rgba(16,185,129,.4);transition:transform .1s,opacity .1s}
  .add-btn:active{transform:scale(.92);opacity:.85}

  /* BACKUP BANNER */
  .backup-banner{margin:10px 16px 0;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;animation:slideIn .3s ease}
  .backup-banner-text{flex:1;font-size:12px;color:var(--amber);line-height:1.4}
  .backup-banner-text strong{display:block;font-size:13px;margin-bottom:2px}
  .backup-now-btn{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:var(--amber);font-family:var(--mono);font-size:10px;font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;letter-spacing:.5px}
  .backup-dismiss{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 2px}

  /* SEARCH */
  .search-wrap{position:relative;margin-top:10px}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
  .search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px 10px 36px;color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .2s}
  .search-input::placeholder{color:var(--text3)}
  .search-input:focus{border-color:var(--accent)}
  .clear-search{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--text3);border:none;color:var(--bg);width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;font-weight:700}

  /* LIST */
  .list-section{padding:0 16px}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:14px 0 8px;border-top:1px solid var(--border);margin-top:6px}
  .section-label.first{border-top:none;margin-top:0}

  .defaut-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color .2s;animation:slideIn .2s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .defaut-card.open{border-color:var(--accent)}
  .card-header{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
  .card-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--bg3)}
  .card-thumb-placeholder{width:44px;height:44px;border-radius:7px;background:var(--bg3);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text3);font-size:18px}
  .card-main{flex:1;min-width:0}
  .card-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{font-size:12px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
  .card-photo-count{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:3px}
  .chevron{color:var(--text3);font-size:14px;transition:transform .2s;flex-shrink:0}
  .defaut-card.open .chevron{transform:rotate(90deg)}

  /* CARD DETAIL */
  .card-detail{display:none;padding:0 14px 16px;border-top:1px solid var(--border)}
  .defaut-card.open .card-detail{display:block}
  .detail-fields{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .detail-field{display:flex;flex-direction:column;gap:4px}
  .field-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
  .field-value{font-size:14px;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 11px;outline:none;font-family:var(--sans);transition:border-color .2s;resize:none;-webkit-appearance:none;width:100%}
  .field-value:focus{border-color:var(--accent)}

  /* PHOTOS */
  .photos-section{margin-top:14px}
  .photos-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
  .photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .photo-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .photo-item img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-delete{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.75);border:none;border-radius:50%;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .add-photo-btn{aspect-ratio:1;border-radius:8px;border:1.5px dashed var(--border);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:border-color .2s}
  .add-photo-btn:active{border-color:var(--accent)}
  .add-photo-icon{font-size:22px}
  .add-photo-text{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px}
  input[type="file"]{display:none}

  /* CARD ACTIONS */
  .card-actions{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;padding:10px;border-radius:8px;border:none;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.97);opacity:.85}
  .btn-save{background:var(--accent);color:#000}
  .btn-delete{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}

  /* LIGHTBOX */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:400;align-items:center;justify-content:center;flex-direction:column}
  .lightbox.active{display:flex}
  .lightbox img{max-width:100vw;max-height:85dvh;object-fit:contain;border-radius:4px}
  .lightbox-close{position:absolute;top:calc(var(--safe-top) + 16px);right:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lightbox-nav{display:flex;gap:20px;margin-top:16px}
  .lightbox-nav button{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 20px;border-radius:20px;font-family:var(--mono);font-size:12px;cursor:pointer}
  .lightbox-counter{font-family:var(--mono);font-size:12px;color:var(--text3);margin-top:10px}

  /* LOADING / EMPTY */
  .loading{text-align:center;padding:60px 32px;font-family:var(--mono);font-size:12px;color:var(--text3)}
  .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:70px 32px;color:var(--text3)}
  .empty-icon{font-size:42px;margin-bottom:14px}
  .empty-title{font-size:16px;color:var(--text2);margin-bottom:6px}
  .empty-sub{font-size:13px;line-height:1.6}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;align-items:flex-end}
  .modal-overlay.active{display:flex}
  .modal{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:0 20px calc(var(--safe-bottom) + 28px);animation:slideUp .25s ease;max-height:92dvh;overflow-y:auto}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 20px}
  .modal-title{font-size:18px;font-weight:600;margin-bottom:18px}
  .modal-fields{display:flex;flex-direction:column;gap:14px}
  .modal-field{display:flex;flex-direction:column;gap:5px}
  .modal-photos-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .modal-photo-thumb{width:70px;height:70px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
  .modal-photo-wrap{position:relative;display:inline-block}
  .modal-photo-del{position:absolute;top:-5px;right:-5px;width:20px;height:20px;background:var(--red);border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal-add-photo{width:70px;height:70px;border-radius:8px;border:1.5px dashed var(--border);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:20px;color:var(--text3)}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .btn-cancel{flex:1;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
  .btn-confirm{flex:1.5;background:var(--accent);color:#000}

  /* CONFIRM */
  .confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:600;align-items:center;justify-content:center;padding:24px}
  .confirm-overlay.active{display:flex}
  .confirm-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px 20px 20px;width:100%;max-width:320px;animation:popIn .18s ease}
  @keyframes popIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
  .confirm-icon{font-size:32px;text-align:center;margin-bottom:10px}
  .confirm-title{font-size:16px;font-weight:600;text-align:center;margin-bottom:6px}
  .confirm-sub{font-size:13px;color:var(--text3);text-align:center;line-height:1.5;margin-bottom:20px}
  .confirm-btns{display:flex;gap:10px}
  .confirm-cancel{flex:1;padding:11px;border-radius:9px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
  .confirm-ok{flex:1;padding:11px;border-radius:9px;border:none;background:var(--red);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}

  /* TOAST */
  .toast{position:fixed;bottom:calc(var(--safe-bottom) + 24px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:10px 22px;border-radius:20px;z-index:500;transition:transform .3s ease;white-space:nowrap;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .bottom-pad{height:calc(var(--safe-bottom) + 20px)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">🔧</div>
  <div class="login-title">Défauts Résolus</div>
  <div class="login-sub">ACCÈS SÉCURISÉ — CPM</div>
  <input class="login-input" id="loginInput" type="password" placeholder="••••" maxlength="10">
  <button class="login-btn" onclick="doLogin()">ENTRER</button>
  <div class="login-error" id="loginError"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-label">Base de données partagée</span>
        <span class="brand-title">Défauts Résolus</span>
        <div class="brand-meta">
          <span class="sync-dot" id="syncDot"></span>
          <span class="sync-label" id="syncLabel">Connexion...</span>
          &nbsp;&nbsp;
          <span class="brand-count" id="totalCount"></span>
        </div>
      </div>
      <div class="header-btns">
        <button class="export-btn" onclick="exportData()" title="Exporter">⬇︎</button>
        <button class="add-btn" onclick="openModal()">+</button>
      </div>
    </div>
    <div id="backupBanner" style="display:none">
      <div class="backup-banner">
        <span style="font-size:20px">💾</span>
        <div class="backup-banner-text">
          <strong>Sauvegarde recommandée</strong>
          Plus d'une semaine sans export.
        </div>
        <button class="backup-now-btn" onclick="exportData()">EXPORTER</button>
        <button class="backup-dismiss" onclick="dismissBackup()">✕</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" type="search" id="searchInput" placeholder="Rechercher installation, titre, notes…" oninput="onSearch(this)" value="">
      <button class="clear-search" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="list-section" id="listContainer">
    <div class="loading"><div class="spinner"></div>Chargement…</div>
  </div>
  <div class="bottom-pad"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Nouveau défaut résolu</div>
      <div class="modal-fields">
        <div class="modal-field">
          <label class="field-label">Titre / Description</label>
          <input class="field-value" id="m-titre" placeholder="Ex: Fuite hydraulique bras 3" type="text">
        </div>
        <div class="modal-field">
          <label class="field-label">Installation concernée</label>
          <input class="field-value" id="m-installation" placeholder="Ex: Robot gripper ligne A" type="text">
        </div>
        <div class="modal-field">
          <label class="field-label">Date de résolution</label>
          <input class="field-value" id="m-date" type="date">
        </div>
        <div class="modal-field">
          <label class="field-label">Notes / Solution appliquée</label>
          <textarea class="field-value" id="m-notes" rows="3" placeholder="Décrire la cause, la solution..."></textarea>
        </div>
        <div class="modal-field">
          <label class="field-label">Photos</label>
          <div class="modal-photos-preview" id="m-photos-preview"></div>
          <div class="modal-add-photo" onclick="document.getElementById('m-photo-input').click()">📷</div>
          <input type="file" id="m-photo-input" accept="image/*" multiple onchange="handleModalPhotos(this)">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn btn-confirm" id="confirmAddBtn" onclick="addDefaut()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-nav" onclick="event.stopPropagation()">
      <button onclick="lbPrev()">← Préc.</button>
      <button onclick="lbNext()">Suiv. →</button>
    </div>
    <div class="lightbox-counter" id="lbCounter"></div>
  </div>

  <!-- CONFIRM -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-icon" id="confirmIcon">🗑️</div>
      <div class="confirm-title" id="confirmTitle">Supprimer ?</div>
      <div class="confirm-sub" id="confirmSub">Cette action est irréversible.</div>
      <div class="confirm-btns">
        <button class="confirm-cancel" onclick="confirmResolve(false)">Annuler</button>
        <button class="confirm-ok" id="confirmOkBtn" onclick="confirmResolve(true)">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG FIREBASE REST ───────────────────────────────
const PROJECT_ID = 'defauts-cpm';
const API_KEY    = 'AIzaSyCxfSOGtC0wnCqPDAVWObDL3NLpDNX39ro';
const BASE_URL   = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/defauts`;

// ── LOGIN ──────────────────────────────────────────────
const PASSWORD = 'CPM';

function doLogin() {
  const val = document.getElementById('loginInput').value.trim().toUpperCase();
  if (val === PASSWORD) {
    sessionStorage.setItem('cpm_auth', '1');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    startApp();
  } else {
    const input = document.getElementById('loginInput');
    input.classList.add('error');
    document.getElementById('loginError').textContent = 'Mot de passe incorrect';
    setTimeout(() => { input.classList.remove('error'); input.value = ''; }, 600);
  }
}

document.getElementById('loginInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

if (sessionStorage.getItem('cpm_auth') === '1') {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  startApp();
}

// ── STATE ──────────────────────────────────────────────
let defauts = [];
let openCard = null;
let modalPhotos = [];
let lbPhotos = [], lbIndex = 0;
let confirmCallback = null;
let pollInterval = null;

// ── FIRESTORE REST HELPERS ─────────────────────────────
// Convertit un document Firestore REST en objet JS simple
function fromFirestore(doc) {
  const id = doc.name.split('/').pop();
  const fields = doc.fields || {};
  const obj = { _id: id };
  for (const [k, v] of Object.entries(fields)) {
    if (v.stringValue !== undefined) obj[k] = v.stringValue;
    else if (v.integerValue !== undefined) obj[k] = parseInt(v.integerValue);
    else if (v.booleanValue !== undefined) obj[k] = v.booleanValue;
    else if (v.arrayValue !== undefined) {
      obj[k] = (v.arrayValue.values || []).map(x => x.stringValue || '');
    }
    else if (v.timestampValue !== undefined) obj[k] = v.timestampValue;
  }
  return obj;
}

// Convertit un objet JS en format Firestore REST
function toFirestore(obj) {
  const fields = {};
  for (const [k, v] of Object.entries(obj)) {
    if (k === '_id') continue;
    if (Array.isArray(v)) {
      fields[k] = { arrayValue: { values: v.map(s => ({ stringValue: s })) } };
    } else if (typeof v === 'string') {
      fields[k] = { stringValue: v };
    } else if (typeof v === 'number') {
      fields[k] = { integerValue: String(v) };
    }
  }
  return { fields };
}

async function fetchAll() {
  const res = await fetch(`${BASE_URL}?key=${API_KEY}&orderBy=createdAt&pageSize=200`);
  if (!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  const docs = data.documents || [];
  return docs.map(fromFirestore).sort((a,b) => {
    // Trier par date décroissante
    const da = a.date || a.createdAt || '';
    const db2 = b.date || b.createdAt || '';
    return db2.localeCompare(da);
  });
}

async function createDoc(obj) {
  obj.createdAt = new Date().toISOString();
  const res = await fetch(`${BASE_URL}?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(toFirestore(obj))
  });
  if (!res.ok) throw new Error('create failed');
  return fromFirestore(await res.json());
}

async function updateDoc(id, obj) {
  const fields = toFirestore(obj).fields;
  const fieldPaths = Object.keys(fields).join(',');
  const res = await fetch(`${BASE_URL}/${id}?key=${API_KEY}&updateMask.fieldPaths=${encodeURIComponent(fieldPaths)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
  if (!res.ok) throw new Error('update failed');
}

async function deleteDoc(id) {
  const res = await fetch(`${BASE_URL}/${id}?key=${API_KEY}`, { method: 'DELETE' });
  if (!res.ok) throw new Error('delete failed');
}

// ── APP START ──────────────────────────────────────────
async function startApp() {
  setSyncStatus('syncing', 'Connexion…');
  await loadData();
  checkBackupReminder();
  // Polling toutes les 30s pour synchro temps réel
  pollInterval = setInterval(loadData, 30000);
}

async function loadData() {
  try {
    defauts = await fetchAll();
    setSyncStatus('online', 'Synchronisé');
    renderList();
  } catch(e) {
    setSyncStatus('error', 'Hors ligne');
  }
}

function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

// ── SEARCH ─────────────────────────────────────────────
function onSearch(input) {
  document.getElementById('clearBtn').style.display = input.value ? 'flex' : 'none';
  renderList();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  renderList();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) return defauts;
  return defauts.filter(d =>
    (d.titre||'').toLowerCase().includes(q) ||
    (d.installation||'').toLowerCase().includes(q) ||
    (d.notes||'').toLowerCase().includes(q)
  );
}

// ── RENDER ─────────────────────────────────────────────
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hi(text, q) {
  if (!q) return esc(text);
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp(`(${safe})`, 'gi'),
    '<mark style="background:rgba(16,185,129,.25);color:inherit;border-radius:2px">$1</mark>');
}

function formatDate(d) {
  if (!d) return 'Sans date';
  const dt = new Date(d + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - dt) / 86400000);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return 'Hier';
  return dt.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = getFiltered();
  const total = defauts.length;
  document.getElementById('totalCount').textContent =
    `${total} défaut${total>1?'s':''} enregistré${total>1?'s':''}`;

  const container = document.getElementById('listContainer');
  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Aucun résultat</div><div class="empty-sub">Essaie d'autres mots‑clés ou ajoute un nouveau défaut.</div></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(d => {
    const g = d.date || '__nodate__';
    if (!groups[g]) groups[g] = [];
    groups[g].push(d);
  });

  const keys = Object.keys(groups).sort((a,b) => {
    if (a==='__nodate__') return 1; if (b==='__nodate__') return -1;
    return b.localeCompare(a);
  });

  container.innerHTML = keys.map((key, gi) => {
    const label = key==='__nodate__' ? 'Sans date' : formatDate(key);
    return `<div class="section-label${gi===0?' first':''}">${label}</div>` +
      groups[key].map(d => renderCard(d, q)).join('');
  }).join('');
}

function renderCard(d, q) {
  const isOpen = openCard === d._id;
  const photos = d.photos || [];
  const thumb = photos.length > 0
    ? `<img class="card-thumb" src="${photos[0]}" alt="" onclick="event.stopPropagation();openLightbox('${d._id}',0)">`
    : `<div class="card-thumb-placeholder">📷</div>`;
  const photoLabel = photos.length > 0
    ? `<div class="card-photo-count">${photos.length} photo${photos.length>1?'s':''}</div>` : '';

  const photosGrid = photos.length > 0 ? `
    <div class="photos-section">
      <div class="photos-label">Photos (${photos.length})</div>
      <div class="photos-grid">
        ${photos.map((p,i) => `
          <div class="photo-item" onclick="openLightbox('${d._id}',${i})">
            <img src="${p}" alt="">
            <button class="photo-delete" onclick="event.stopPropagation();deletePhoto('${d._id}',${i})">✕</button>
          </div>`).join('')}
        <div class="add-photo-btn" onclick="triggerPhotoAdd('${d._id}')">
          <span class="add-photo-icon">📷</span>
          <span class="add-photo-text">AJOUTER</span>
        </div>
      </div>
    </div>` : `
    <div class="photos-section">
      <div class="photos-label">Photos</div>
      <div class="add-photo-btn" style="aspect-ratio:unset;padding:16px;gap:8px;flex-direction:row;justify-content:flex-start" onclick="triggerPhotoAdd('${d._id}')">
        <span style="font-size:20px">📷</span>
        <span class="add-photo-text">Ajouter des photos</span>
      </div>
    </div>`;

  return `
  <div class="defaut-card${isOpen?' open':''}" id="card-${d._id}">
    <div class="card-header" onclick="toggleCard('${d._id}')">
      ${thumb}
      <div class="card-main">
        <div class="card-title">${hi(d.titre||'', q)}</div>
        <div class="card-sub">${hi(d.installation||'', q)}</div>
        ${photoLabel}
      </div>
      <span class="chevron">›</span>
    </div>
    <div class="card-detail">
      <div class="detail-fields">
        <div class="detail-field">
          <label class="field-label">Titre</label>
          <input class="field-value" id="f-titre-${d._id}" value="${esc(d.titre)}" type="text">
        </div>
        <div class="detail-field">
          <label class="field-label">Installation concernée</label>
          <input class="field-value" id="f-inst-${d._id}" value="${esc(d.installation)}" type="text">
        </div>
        <div class="detail-field">
          <label class="field-label">Date de résolution</label>
          <input class="field-value" type="date" id="f-date-${d._id}" value="${d.date||''}">
        </div>
        <div class="detail-field">
          <label class="field-label">Notes / Solution appliquée</label>
          <textarea class="field-value" id="f-notes-${d._id}" rows="4">${esc(d.notes||'')}</textarea>
        </div>
      </div>
      ${photosGrid}
      <input type="file" id="photo-input-${d._id}" accept="image/*" multiple onchange="handlePhotos('${d._id}',this)" style="display:none">
      <div class="card-actions">
        <button class="btn btn-save" onclick="saveCard('${d._id}')">✓ Enregistrer</button>
        <button class="btn btn-delete" onclick="deleteDefaut('${d._id}')">✕ Supprimer</button>
      </div>
    </div>
  </div>`;
}

// ── INTERACTIONS ───────────────────────────────────────
function toggleCard(id) {
  openCard = openCard === id ? null : id;
  renderList();
  if (openCard) setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 60);
}

async function saveCard(id) {
  const titre = document.getElementById('f-titre-' + id)?.value.trim() || '';
  const installation = document.getElementById('f-inst-' + id)?.value.trim() || '';
  const date = document.getElementById('f-date-' + id)?.value || '';
  const notes = document.getElementById('f-notes-' + id)?.value.trim() || '';
  const d = defauts.find(x => x._id === id);
  const photos = d ? (d.photos || []) : [];
  setSyncStatus('syncing', 'Sauvegarde…');
  try {
    await updateDoc(id, { titre, installation, date, notes, photos });
    // Mise à jour locale immédiate
    if (d) { d.titre=titre; d.installation=installation; d.date=date; d.notes=notes; }
    setSyncStatus('online', 'Synchronisé');
    showToast('✓ Enregistré');
    renderList();
  } catch(e) {
    showToast('❌ Erreur de sauvegarde');
    setSyncStatus('error', 'Erreur');
  }
}

function deleteDefaut(id) {
  showConfirm('🗑️', 'Supprimer ce défaut ?', 'Cette action est irréversible.', 'Supprimer', async () => {
    setSyncStatus('syncing', 'Suppression…');
    try {
      await deleteDoc(id);
      defauts = defauts.filter(d => d._id !== id);
      openCard = null;
      setSyncStatus('online', 'Synchronisé');
      showToast('Défaut supprimé');
      renderList();
    } catch(e) {
      showToast('❌ Erreur'); setSyncStatus('error', 'Erreur');
    }
  });
}

// ── PHOTOS ─────────────────────────────────────────────
function compress(file, cb) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 1200;
    let w = img.width, h = img.height;
    if (w > MAX) { h = h*MAX/w; w = MAX; }
    if (h > MAX) { w = w*MAX/h; h = MAX; }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/jpeg', 0.72));
  };
  img.src = url;
}

function triggerPhotoAdd(id) {
  document.getElementById('photo-input-' + id).click();
}

function handlePhotos(id, input) {
  const files = Array.from(input.files);
  let loaded = 0;
  const newPhotos = [];
  files.forEach(file => {
    compress(file, b64 => {
      newPhotos.push(b64);
      loaded++;
      if (loaded === files.length) {
        const d = defauts.find(x => x._id === id);
        const allPhotos = [...(d?.photos||[]), ...newPhotos];
        setSyncStatus('syncing', 'Upload…');
        updateDoc(id, { photos: allPhotos })
          .then(() => {
            if (d) d.photos = allPhotos;
            openCard = id;
            setSyncStatus('online', 'Synchronisé');
            showToast(`📷 ${files.length} photo${files.length>1?'s':''} ajoutée${files.length>1?'s':''}`);
            renderList();
            setTimeout(() => {
              const el = document.getElementById('card-' + id);
              if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
            }, 60);
          })
          .catch(() => { showToast('❌ Erreur upload'); setSyncStatus('error','Erreur'); });
      }
    });
  });
  input.value = '';
}

function deletePhoto(id, index) {
  showConfirm('🖼️', 'Supprimer cette photo ?', 'La photo sera effacée définitivement.', 'Supprimer', async () => {
    const d = defauts.find(x => x._id === id);
    if (!d || !d.photos) return;
    const photos = [...d.photos];
    photos.splice(index, 1);
    setSyncStatus('syncing', 'Suppression…');
    try {
      await updateDoc(id, { photos });
      d.photos = photos;
      openCard = id;
      setSyncStatus('online', 'Synchronisé');
      showToast('Photo supprimée');
      renderList();
    } catch(e) {
      showToast('❌ Erreur'); setSyncStatus('error','Erreur');
    }
  });
}

// ── LIGHTBOX ───────────────────────────────────────────
function openLightbox(id, index) {
  const d = defauts.find(x => x._id === id);
  if (!d?.photos?.length) return;
  lbPhotos = d.photos; lbIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('active');
}
function updateLightbox() {
  document.getElementById('lightbox-img').src = lbPhotos[lbIndex];
  document.getElementById('lbCounter').textContent = `${lbIndex+1} / ${lbPhotos.length}`;
}
function lbPrev() { lbIndex = (lbIndex-1+lbPhotos.length)%lbPhotos.length; updateLightbox(); }
function lbNext() { lbIndex = (lbIndex+1)%lbPhotos.length; updateLightbox(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

let tsX = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, {passive:true});
document.getElementById('lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsX;
  if (Math.abs(dx) > 50) { dx < 0 ? lbNext() : lbPrev(); }
}, {passive:true});

// ── MODAL ──────────────────────────────────────────────
function openModal() {
  modalPhotos = [];
  document.getElementById('m-titre').value = '';
  document.getElementById('m-installation').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
  renderModalPhotos();
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => document.getElementById('m-titre').focus(), 150);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); modalPhotos = []; }
function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

function handleModalPhotos(input) {
  Array.from(input.files).forEach(file => {
    compress(file, b64 => { modalPhotos.push(b64); renderModalPhotos(); });
  });
  input.value = '';
}
function renderModalPhotos() {
  document.getElementById('m-photos-preview').innerHTML = modalPhotos.map((p,i) => `
    <div class="modal-photo-wrap">
      <img class="modal-photo-thumb" src="${p}" alt="">
      <button class="modal-photo-del" onclick="removeModalPhoto(${i})">✕</button>
    </div>`).join('');
}
function removeModalPhoto(i) { modalPhotos.splice(i,1); renderModalPhotos(); }

async function addDefaut() {
  const titre = document.getElementById('m-titre').value.trim();
  if (!titre) { document.getElementById('m-titre').focus(); return; }
  const btn = document.getElementById('confirmAddBtn');
  btn.textContent = '…'; btn.disabled = true;
  const obj = {
    titre,
    installation: document.getElementById('m-installation').value.trim() || '—',
    notes: document.getElementById('m-notes').value.trim(),
    date: document.getElementById('m-date').value || new Date().toISOString().split('T')[0],
    photos: [...modalPhotos],
    createdAt: new Date().toISOString(),
  };
  setSyncStatus('syncing', 'Sauvegarde…');
  try {
    const created = await createDoc(obj);
    defauts.unshift(created);
    closeModal();
    openCard = created._id;
    setSyncStatus('online', 'Synchronisé');
    showToast('✓ Défaut ajouté');
    renderList();
  } catch(e) {
    showToast('❌ Erreur'); setSyncStatus('error','Erreur');
  }
  btn.textContent = 'Enregistrer'; btn.disabled = false;
}

// ── CONFIRM ────────────────────────────────────────────
function showConfirm(icon, title, sub, okLabel, cb) {
  document.getElementById('confirmIcon').textContent = icon;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmSub').textContent = sub;
  document.getElementById('confirmOkBtn').textContent = okLabel;
  confirmCallback = cb;
  document.getElementById('confirmOverlay').classList.add('active');
}
function confirmResolve(ok) {
  document.getElementById('confirmOverlay').classList.remove('active');
  if (ok && confirmCallback) confirmCallback();
  confirmCallback = null;
}

// ── EXPORT ─────────────────────────────────────────────
function exportData() {
  if (!defauts.length) { showToast('Aucune donnée à exporter'); return; }
  const json = JSON.stringify({ exportDate: new Date().toISOString(), total: defauts.length, defauts }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `defauts-CPM-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  localStorage.setItem('cpm_last_export', Date.now().toString());
  checkBackupReminder();
  showToast('✓ Sauvegarde exportée');
}

function dismissBackup() {
  document.getElementById('backupBanner').style.display = 'none';
  localStorage.setItem('cpm_last_export', Date.now().toString());
}

function checkBackupReminder() {
  const last = parseInt(localStorage.getItem('cpm_last_export') || '0');
  const show = Date.now() - last > 7 * 24 * 60 * 60 * 1000;
  document.getElementById('backupBanner').style.display = show ? 'block' : 'none';
}

// ── TOAST ──────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
